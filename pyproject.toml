[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swafra"
version = "0.2.6"
description = "Leiden-chunked, graph-linked semantic memory as an MCP server for Claude, Copilot, and any MCP-compatible AI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kunal12203", email = "kunal12203@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "memory", "knowledge-graph", "leiden", "semantic-search", "claude", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
leiden = [
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
]

[project.scripts]
swafra = "swafra.cli:main"

[project.urls]
Homepage = "https://github.com/kunal12203/swafra"
Repository = "https://github.com/kunal12203/swafra"
"Bug Tracker" = "https://github.com/kunal12203/swafra/issues"

[tool.hatch.build.targets.wheel]
packages = ["swafra", "engine"]

[tool.hatch.build.targets.sdist]
include = ["swafra/", "engine/", "README.md", "LICENSE"]
