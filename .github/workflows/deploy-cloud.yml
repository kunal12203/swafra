name: deploy-cloud

on:
  push:
    branches: [production]
    paths:
      - "engine/**"
      - "cloud/**"
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SWAFRA_LIGHTSAIL_SERVICE: swafra-cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install lightsailctl
        run: |
          curl -fsSL -o /tmp/lightsailctl \
            "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl"
          sudo mv /tmp/lightsailctl /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Deploy to Lightsail
        env:
          SWAFRA_DOCKER_PLATFORM: linux/amd64
          SWAFRA_CLOUD_SECRET_ID: swafra/cloud/prod
        run: bash deploy/lightsail-deploy.sh
